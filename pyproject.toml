[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frustum-loader"
version = "0.5.1"
description = "Bounded-memory streaming inference for checkpoints far larger than GPU memory"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aaron Grace" }]
# Install a CUDA build of torch first; see the README. A plain `pip install torch` may be CPU-only.
dependencies = ["torch>=2.6", "numpy", "tokenizers"]

[project.optional-dependencies]
gguf = ["gguf>=0.19"]

[project.scripts]
frustum-chat = "frustum_chat:main"
frustum-inspect = "frustum_loader:main"

[tool.setuptools]
py-modules = [
    "frustum_loader", "cache_policy", "expert_cache", "placement", "generation",
    "frustum_chat", "streamed_moe", "layers0_3_block", "layer0_block", "block_primitives",
    "expert_correctness", "sparse_rows", "reproducibility", "decode_cache_replay",
    "reference_parity", "verify_upgrade", "selftest", "long_context_check", "glm_chat", "phi4_chat",
]
